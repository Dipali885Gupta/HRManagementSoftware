<abp-page [title]="title | abpLocalization">
  <abp-page-toolbar-container class="col">
    <!--<suite-custom-code-block-0>-->
    <!--</suite-custom-code-block-0>-->
    <div class="text-lg-end pt-2">
      <!--<suite-custom-code-block-1>-->
      <!--</suite-custom-code-block-1>-->
      <button
        class="btn btn-primary btn-sm mx-2"
        type="button"
        [disabled]="service.isExportToExcelBusy"
        (click)="exportToExcel()"
      >
        {{ '::ExportToExcel' | abpLocalization }}
      </button>
      <button
        *abpPermission="'HRManagementSoftware.PayrollAdjustments.Create'"
        class="btn btn-primary btn-sm"
        type="button"
        (click)="create()"
      >
        <i class="fa fa-plus me-1" aria-hidden="true"></i>
        {{ '::NewPayrollAdjustment' | abpLocalization }}
      </button>
      <!--<suite-custom-code-block-2>-->
      <!--</suite-custom-code-block-2>-->
    </div>
  </abp-page-toolbar-container>

  <!--<suite-custom-code-block-5>-->
  <!--</suite-custom-code-block-5>-->
  <div class="payroll-dashboard">
    <!-- Payroll Info Card -->
    <div class="card payroll-info mb-4">
      <div class="card-body">
        <div class="d-flex align-items-center">
          <div class="payroll-avatar">
            <i class="fa fa-calculator"></i>
          </div>
          <div class="ms-3">
            <h5 class="mb-1">Payroll Adjustments</h5>
            <h3 class="mb-0">Management</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Payroll Adjustments Table Card -->
    <div class="card">
      <div class="card-header">
        <h5 class="card-title mb-0">Payroll Adjustment Records</h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th>Year</th>
                <th>Month</th>
                <th>Net Pay</th>
                <th>Leave Request ID</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let adjustment of payrollAdjustments">
                <td>{{ adjustment.year }}</td>
                <td>{{ adjustment.month }}</td>
                <td>${{ adjustment.netpay }}</td>
                <td>{{ adjustment.leavereqid }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <!--<suite-custom-code-block-11>-->
  <!--</suite-custom-code-block-11>-->
</abp-page>
<!--<suite-custom-code-block-12>-->
<!--</suite-custom-code-block-12>-->

@defer (when serviceDetail.isVisible) {
  @if (serviceDetail.isVisible) {
    <app-payroll-adjustment-detail-modal />
  }
}
