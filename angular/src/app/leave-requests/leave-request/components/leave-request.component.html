<abp-page [title]="title | abpLocalization">
  <abp-page-toolbar-container class="col">
    <!--<suite-custom-code-block-0>-->
    <!--</suite-custom-code-block-0>-->
    <div class="text-lg-end pt-2">
      <!--<suite-custom-code-block-1>-->
      <!--</suite-custom-code-block-1>-->

      <button
        class="btn btn-primary btn-sm mx-2"
        type="button"
        [disabled]="service.isExportToExcelBusy"
        (click)="exportToExcel()"
      >
        {{ '::ExportToExcel' | abpLocalization }}
      </button>

      <button
        *abpPermission="'HRManagementSoftware.LeaveRequests.Create'"
        class="btn btn-primary btn-sm"
        type="button"
        id="new-leave-btn"
        (click)="create()"
      >
        <i class="fa fa-plus me-1" aria-hidden="true"></i>
        {{ '::NewLeaveRequest' | abpLocalization }}
      </button>
      <!--<suite-custom-code-block-2>-->
      <!--</suite-custom-code-block-2>-->
    </div>
  </abp-page-toolbar-container>

  <!--<suite-custom-code-block-5>-->
  <!--</suite-custom-code-block-5>-->
  <div class="leave-dashboard">
    <!-- Leave Request Info Card -->
    <div class="card leave-info mb-4">
      <div class="card-body">
        <div class="d-flex align-items-center">
          <div class="leave-avatar">
            <i class="fa fa-calendar-alt"></i>
          </div>
          <div class="ms-3">
            <h5 class="mb-1">Leave Requests</h5>
            <h3 class="mb-0">Management</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Leave Request Form Card -->
    <div class="card">
      <div class="card-header">
        <h5 class="card-title mb-0">Submit New Leave Request</h5>
      </div>
      <div class="card-body">
        <form (ngSubmit)="submitCustom()" class="row g-3 align-items-end">
          <!-- Validation Error Alert -->
          <div class="col-12" *ngIf="validationError">
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
              <i class="fa fa-exclamation-triangle me-2"></i>
              {{ validationError }}
              <button type="button" class="btn-close" (click)="validationError = null" aria-label="Close"></button>
            </div>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label">Employee Number</label>
            <div class="input-group">
              <input
                type="text"
                class="form-control form-control-lg"
                [(ngModel)]="customModel.employeeNumber"
                name="employeeNumber"
                [ngModelOptions]="{ standalone: true }"
                placeholder="Loading..."
                readonly
                [disabled]="isLoadingEmployee"
              />
              <span class="input-group-text" *ngIf="isLoadingEmployee">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              </span>
            </div>
            <small class="text-muted" *ngIf="!isLoadingEmployee && !employeeError">
              Auto-populated from your profile
            </small>
            <small class="text-danger" *ngIf="employeeError">
              {{ employeeError }}
            </small>
          </div>

          <div class="col-12 col-md-3">
            <label class="form-label">Leave Type <span class="text-danger">*</span></label>
            <select
              class="form-select form-select-lg"
              [(ngModel)]="customModel.leaveType"
              name="leaveType"
              [ngModelOptions]="{ standalone: true }"
              required
            >
              <option [ngValue]="null">-- Select Leave Type --</option>
              <option *ngFor="let opt of leaveTypeOptions; trackBy: track.by('value')" [ngValue]="opt.value">
                {{ '::Enum:LeaveType.' + opt.value | abpLocalization }}
              </option>
            </select>
          </div>

          <div class="col-12 col-md-2">
            <label class="form-label">Start Date <span class="text-danger">*</span></label>
            <input
              type="date"
              class="form-control form-control-lg"
              [(ngModel)]="customModel.startDate"
              id="leave-start-date"
              name="startDate"
              [ngModelOptions]="{ standalone: true }"
              [min]="getMinDate()"
              required
            />
          </div>

          <div class="col-12 col-md-2">
            <label class="form-label">End Date <span class="text-danger">*</span></label>
            <input
              type="date"
              class="form-control form-control-lg"
              [(ngModel)]="customModel.endDate"
              id="leave-end-date"
              name="endDate"
              [ngModelOptions]="{ standalone: true }"
              [min]="customModel.startDate"
              required
            />
          </div>

          <div class="col-12 col-md-12">
            <label class="form-label">Reason <span class="text-danger">*</span></label>
            <textarea
              class="form-control"
              rows="3"
              [(ngModel)]="customModel.reason"
              id="leave-reason"
              name="reason"
              [ngModelOptions]="{ standalone: true }"
              placeholder="Please provide a detailed reason for your leave request..."
              required
            ></textarea>
          </div>

          <div class="col-12 text-end">
            <button
              type="button"
              class="btn btn-outline-secondary me-2"
              (click)="resetForm()"
              [disabled]="isSubmitting"
            >
              <i class="fa fa-undo me-1"></i>
              Reset
            </button>
            <button
              type="submit"
              class="btn btn-success btn-lg"
              id="submit-leave-btn"
              [disabled]="isSubmitting || isLoadingEmployee"
            >
              <i class="fa fa-paper-plane me-1" *ngIf="!isSubmitting"></i>
              <span class="spinner-border spinner-border-sm me-1" *ngIf="isSubmitting" role="status" aria-hidden="true"></span>
              {{ isSubmitting ? 'Submitting...' : 'Submit Request' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <!--</suite-custom-code-block-5>-->
  <!--<suite-custom-code-block-11>-->
  <!--</suite-custom-code-block-11>-->
</abp-page>
<!--<suite-custom-code-block-12>-->
<!--</suite-custom-code-block-12>-->

@defer (when serviceDetail.isVisible) {
  @if (serviceDetail.isVisible) {
    <app-leave-request-detail-modal />
  }
}
