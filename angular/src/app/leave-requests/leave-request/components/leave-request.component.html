<abp-page [title]="title | abpLocalization">
  <abp-page-toolbar-container class="col">
    <!--<suite-custom-code-block-0>-->
    <!--</suite-custom-code-block-0>-->
    <div class="text-lg-end pt-2">
      <!--<suite-custom-code-block-1>-->
      <!--</suite-custom-code-block-1>-->

      <button
        class="btn btn-primary btn-sm mx-2"
        type="button"
        [disabled]="service.isExportToExcelBusy"
        (click)="exportToExcel()"
      >
        {{ '::ExportToExcel' | abpLocalization }}
      </button>

      <button
        *abpPermission="'HRManagementSoftware.LeaveRequests.Create'"
        class="btn btn-primary btn-sm"
        type="button"
        (click)="create()"
      >
        <i class="fa fa-plus me-1" aria-hidden="true"></i>
        {{ '::NewLeaveRequest' | abpLocalization }}
      </button>
      <!--<suite-custom-code-block-2>-->
      <!--</suite-custom-code-block-2>-->
    </div>
  </abp-page-toolbar-container>

  <!--<suite-custom-code-block-5>-->
  <!--</suite-custom-code-block-5>-->
  <div class="leave-dashboard">
    <!-- Leave Request Info Card -->
    <div class="card leave-info mb-4">
      <div class="card-body">
        <div class="d-flex align-items-center">
          <div class="leave-avatar">
            <i class="fa fa-calendar-alt"></i>
          </div>
          <div class="ms-3">
            <h5 class="mb-1">Leave Requests</h5>
            <h3 class="mb-0">Management</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Leave Request Form Card -->
    <div class="card">
      <div class="card-header">
        <h5 class="card-title mb-0">Submit New Leave Request</h5>
      </div>
      <div class="card-body">
        <form (ngSubmit)="submitCustom()" class="row g-3 align-items-end">
          <div class="col-12 col-md-3">
            <label class="form-label">Employee Number</label>
            <input
              type="text"
              class="form-control form-control-lg"
              [(ngModel)]="customModel.employeeNumber"
              name="employeeNumber"
              [ngModelOptions]="{ standalone: true }"
              placeholder="Enter employee number"
            />
          </div>

          <div class="col-12 col-md-3">
            <label class="form-label">Leave Type</label>
            <select
              class="form-select form-select-lg"
              [(ngModel)]="customModel.leaveType"
              name="leaveType"
              [ngModelOptions]="{ standalone: true }"
            >
              <option [ngValue]="null">-- Select Leave Type --</option>
              <option *ngFor="let opt of leaveTypeOptions; trackBy: track.by('value')" [ngValue]="opt.value">
                {{ '::Enum:LeaveType.' + opt.value | abpLocalization }}
              </option>
            </select>
          </div>

          <div class="col-12 col-md-2">
            <label class="form-label">Start Date</label>
            <input
              type="date"
              class="form-control form-control-lg"
              [(ngModel)]="customModel.startDate"
              name="startDate"
              [ngModelOptions]="{ standalone: true }"
            />
          </div>

          <div class="col-12 col-md-2">
            <label class="form-label">End Date</label>
            <input
              type="date"
              class="form-control form-control-lg"
              [(ngModel)]="customModel.endDate"
              name="endDate"
              [ngModelOptions]="{ standalone: true }"
            />
          </div>

          <div class="col-12 col-md-12">
            <label class="form-label">Reason</label>
            <textarea
              class="form-control"
              rows="3"
              [(ngModel)]="customModel.reason"
              name="reason"
              [ngModelOptions]="{ standalone: true }"
              placeholder="Please provide a detailed reason for your leave request..."
            ></textarea>
          </div>

          <div class="col-12 text-end">
            <button
              type="button"
              class="btn btn-outline-secondary me-2"
              (click)="resetForm()"
              [disabled]="isSubmitting"
            >
              <i class="fa fa-undo me-1"></i>
              Reset
            </button>
            <button
              type="submit"
              class="btn btn-success btn-lg"
              [disabled]="isSubmitting"
            >
              <i class="fa fa-paper-plane me-1"></i>
              {{ isSubmitting ? 'Submitting...' : 'Submit Request' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <!--</suite-custom-code-block-5>-->
  <!--<suite-custom-code-block-11>-->
  <!--</suite-custom-code-block-11>-->
</abp-page>
<!--<suite-custom-code-block-12>-->
<!--</suite-custom-code-block-12>-->

@defer (when serviceDetail.isVisible) {
  @if (serviceDetail.isVisible) {
    <app-leave-request-detail-modal />
  }
}
