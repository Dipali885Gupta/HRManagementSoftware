<div class="row">
    <div class="col-12">
        <div class="card rounded-0 m-0">
            <div class="card-header d-flex align-items-center justify-content-between p-0">
                <!-- Left Side - Title -->
                <div class="header-title">
                    <h3 class="title-text">HR Management Software</h3>
                </div>

                <!-- Center - Navigation Buttons -->
                <div class="header-nav-buttons">
                    <button class="nav-btn" routerLink="/dashboard">
                        <i class="bi bi-house-door"></i>
                        <span>Dashboard</span>
                    </button>
                    <button class="nav-btn" routerLink="/employees">
                        <i class="bi bi-people"></i>
                        <span>Employees</span>
                    </button>
                    <button class="nav-btn" routerLink="/reports">
                        <i class="bi bi-bar-chart"></i>
                        <span>Reports</span>
                    </button>
                </div>

                <!-- Right Side - Action Buttons -->
                <div class="d-flex align-items-center">
                    <div class="header-action-buttons">
                        <button class="action-btn" routerLink="/settings" title="Settings">
                            <i class="bi bi-gear-fill"></i>
                        </button>
                        <button class="action-btn" routerLink="/help" title="Help & Support">
                            <i class="bi bi-question-circle-fill"></i>
                        </button>
                        <button class="action-btn logout-btn" (click)="logout()" title="Logout">
                            <i class="bi bi-box-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
