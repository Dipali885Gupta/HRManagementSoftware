<!-- Dashboard Sidebar -->
<div class="dashboard-sidebar p-2">
  <!-- Header -->
  <div class="mb-3">
    <h5 class="m-0 section-header d-flex align-items-center justify-content-center">
      <i aria-hidden="true" class="lpx-icon fas fa-tachometer-alt"></i>
      <span class="hidden-in-hover-trigger ms-1">Dashboard Overview</span>
    </h5>
  </div>

  <!-- Metrics Cards -->
  <div class="metrics-container mb-3 hidden-in-hover-trigger">
    <div class="metric-card card border rounded mb-2" *ngFor="let metric of metrics">
      <div class="card-body p-2">
        <div class="row align-items-center">
          <div class="col-auto">
            <div class="metric-icon">
              <i [class]="metric.icon"></i>
            </div>
          </div>
          <div class="col">
            <div class="metric-value">{{ metric.value }}</div>
            <div class="metric-title small text-muted">{{ metric.title }}</div>
          </div>
          <div class="col-auto">
            <div class="metric-change">
              <i [class]="getChangeIconClass(metric.changeType)"></i>
              <span class="small ms-1">{{ metric.change }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Recent Updates -->
  <div class="recent-updates hidden-in-hover-trigger">
    <h6 class="mb-2">
      <i class="fas fa-clock me-1"></i>
      Recent Updates
    </h6>
    <div class="updates-list">
      <div class="update-item card border rounded mb-1" *ngFor="let update of recentUpdates">
        <div class="card-body p-2">
          <div class="row">
            <div class="col-auto">
              <i [class]="getUpdateIconClass(update.type)"></i>
            </div>
            <div class="col">
              <div class="update-title small fw-bold">{{ update.title }}</div>
              <div class="update-description small text-muted">{{ update.description }}</div>
              <div class="update-time small text-muted">{{ update.time }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
